server:
  address: 127.0.0.1
  port: 8181

demo:
  # Built by op_trade_bench/build.sh against ~/rocksdb/rocksdb_hash/build-rel.
  bench-binary: ${user.dir}/op_trade_bench/out/op_trade_bench
  # Databases and final metric dumps of each run.
  work-dir: /tmp/otb_work/web
  # The three memtables run at the same time, each on its own P-core pair
  # (i9-12900K: 0-15 are P-core hyperthreads, 16-23 E-cores).
  cpu-sets:
    head: 2-5
    upstream: 6-9
    skiplist: 10-13
  log-lines: 200
  # Same default as op_trade_bench (TPCE_DIR defaults to ~/tpc-e).
  trade-file: ${user.home}/tpc-e/flat_out/Trade.txt
  # Wrap each run in `perf stat` (counting only) and show the hardware
  # counters after it finishes. Turned off automatically when perf cannot run.
  perf-counters: true
