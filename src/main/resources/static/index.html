<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HASH(Rocksdb)</title>
  <link rel="preload" href="fonts/meslo-lgs-dz-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="vendor/uPlot.min.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand">HASH(Rocksdb)</h1>
    <p class="author">소프트웨어학과 21학번 신승호</p>
  </header>

  <main class="page">
    <p class="intro">
      각 카드는 같은 작업을 <span class="tag tag-head">HEAD</span>
      <span class="tag tag-upstream">UPSTREAM</span>
      <span class="tag tag-skiplist">SKIPLIST</span>
      memtable로 동시에 실행하고, 1초마다 지표를 수집해 비교합니다.
    </p>
    <section id="cards" class="cards" aria-live="polite"></section>
  </main>

  <template id="card-template">
    <article class="card">
      <div class="card-head">
        <button class="dial" type="button" aria-label="측정 시작">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle class="dial-face" cx="60" cy="60" r="57"></circle>
            <circle class="dial-track" cx="60" cy="60" r="52"></circle>
            <circle class="dial-track" cx="60" cy="60" r="46"></circle>
            <circle class="dial-track" cx="60" cy="60" r="40"></circle>
            <circle class="dial-arc" data-target="HEAD" cx="60" cy="60" r="52"></circle>
            <circle class="dial-arc" data-target="UPSTREAM" cx="60" cy="60" r="46"></circle>
            <circle class="dial-arc" data-target="SKIPLIST" cx="60" cy="60" r="40"></circle>
          </svg>
          <span class="dial-label">
            <span class="dial-main">측정 시작</span>
            <span class="dial-sub"></span>
          </span>
        </button>
        <div class="divider" role="presentation"></div>
        <div class="card-body">
          <div class="card-title-row">
            <h2 class="card-title"></h2>
            <ul class="specs"></ul>
            <button class="expand" type="button" aria-expanded="false" aria-label="자세히 보기">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
            </button>
          </div>
          <div class="targets"></div>
        </div>
      </div>
      <div class="card-detail" hidden>
        <div class="detail-inner">
          <p class="summary"></p>
          <p class="notice" hidden></p>
          <section class="compare" aria-label="결과 비교"></section>
          <section class="charts" aria-label="실시간 지표"></section>
          <section class="stats" aria-label="RocksDB statistics"></section>
          <details class="logs">
            <summary>실행 로그</summary>
            <div class="log-grid"></div>
          </details>
        </div>
      </div>
    </article>
  </template>

  <script src="vendor/uPlot.iife.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
